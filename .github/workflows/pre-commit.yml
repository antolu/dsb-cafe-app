name: Pre-commit CI Lite

on:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [ master ]

permissions:
  contents: write

jobs:
  pre-commit-ci-lite:
    # Only run on labeled trigger or standard triggers
    if: "github.event.action != 'labeled' || github.event.label.name == 'pre-commit ci run'"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Remove label if present
      if: github.event.action == 'labeled' && github.event.label.name == 'pre-commit ci run'
      run: gh pr edit ${{ github.event.number }} --remove-label 'pre-commit ci run'
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Run pre-commit
      uses: pre-commit/action@v3.0.1

    - name: Pre-commit CI Lite Auto-fix
      uses: pre-commit-ci/lite-action@v1.1.0
      if: always()
